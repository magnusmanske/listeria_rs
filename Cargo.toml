[package]
name = "listeria"
version = "0.1.3"
authors = ["Magnus Manske <magnusmanske@googlemail.com>"]
edition = "2024"
license = "Apache-2.0"

[dependencies]
mimalloc = { version = "0.1", features = ["secure"] }
regex = "^1"
chrono = "0.4"
dashmap = "6"
era_date = "0.1"
rand = "0.9"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
percent-encoding = "2"
wikimisc = { git = "https://github.com/magnusmanske/wikimisc", features = [
	"database",
	"date",
	"entity-id",
	"escape",
	"http",
	"labels",
	"logging",
	"retry",
	"seppuku",
	"site-matrix",
	"sparql-client",
	"sparql-table",
	"telemetry",
	"title",
] }
tokio = { version = "^1", features = ["full", "rt-multi-thread"] }
futures = "0.3"
blake3 = "1"
tempfile = "3"
anyhow = "^1"
thiserror = "^1"
reqwest = { version = "0.13", features = ["gzip", "deflate", "brotli"] }
log = "0.4"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = [
	"http1",
	"http2",
	"tokio",
	"json",
	"macros",
] }
tower-http = { version = "0.6", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
http = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "benchmarks"
harness = false

# No `panic = 'abort'`: a panic must fail only the page it happens in, not
# the whole bot (see `run_page` in src/main_commands.rs).
[profile.release]
lto = 'thin'
codegen-units = 1

[profile.bench]
lto = 'thin'
codegen-units = 1
