"use strict";

$.fn.is_on_screen = function(){
    var win = $(window);
    var viewport = {
        top : win.scrollTop(),
        left : win.scrollLeft()
    };
    viewport.right = viewport.left + win.width();
    viewport.bottom = viewport.top + win.height();
 
    var bounds = this.offset();
    bounds.right = bounds.left + this.outerWidth();
    bounds.bottom = bounds.top + this.outerHeight();
 
    return (!(viewport.right < bounds.left || viewport.left > bounds.right || viewport.bottom < bounds.top || viewport.top > bounds.bottom));
};


var listeria = {

	list : {} ,
	language : 'en' ,
	list : {} ,
	wd : {} ,
	wdl : {} ,
	load_count : 0 ,
	params : {} ,
	sections : {} ,
	update_items : {} ,
	load_labels : {} ,

	thumb_cache : {} ,
	languages : {} ,
	isChrome : false ,
	list_options_is_expanded : false ,
	column_types : [ 'item','label','description','property','prop_qual','prop_item_qual','sitelink' ] ,
	section_types : [ 'property','prop_qual','prop_item_qual' ] ,

		$('a.navbar-brand').click ( function () {

		$('#create_list a').click ( function () {

		} ) ;
		
		$('#search_form').submit ( function () {

		} ) ;

		me.wd.loading_status_callback = function ( a , b ) { $('#loading_message').html(prettyNumber(b-a)+' items from Wikidata') ; } ;
		me.wdl.loading_status_callback = function ( a , b ) { $('#loading_message').html(prettyNumber(b-a)+' labels from Wikidata') ; } ;
		me.wd.getjson_error_handler = function () { alert ( "Wikidata has failed to respond with proper data. Reloading this page might fix the problem." ) } ;

			} ) ;
		} ) ;

	} ,
	
	getParams : function () {
		var me = this ;
		me.params = {} ;
		if ( window.location.href.indexOf('#') == -1 ) return ;
		var hashes = window.location.href.slice(window.location.href.indexOf('#') + 1).split('&');
		$.each ( hashes , function ( i , j ) {
			var hash = j.split('=');
			hash[1] += '' ;
			me.params[hash[0]] = decodeURI(hash[1]).replace(/_/g,' ');
		} ) ;
	} ,
	
	createNewList : function () {

	listItems2Q : function () {

	loading : function ( state ) {

	addAuxItems : function ( tmp ) {
		var me = this ;
		
		function addProps ( v ) {
			if(v.type=='property') {
				v.p = 'P'+me.num(v.p) ;
				tmp.push(v.p) ;
			} else if(v.type=='prop_qual') {
				v.p = 'P'+me.num(v.p) ;
				v.qual = 'P'+me.num(v.qual) ;
				tmp.push(v.p) ;
				tmp.push(v.qual) ;
			} else if(v.type=='prop_item_qual') {
				v.p = 'P'+me.num(v.p) ;
				v.item = 'Q'+me.num(v.item) ;
				v.qual = 'P'+me.num(v.qual) ;
				tmp.push(v.p) ;
				tmp.push(v.item) ;
				tmp.push(v.qual) ;
			}
		}
		
		$.each ( (me.list.config.sections||[]) , function ( k , v ) {
			addProps ( v )
		} ) ;
		$.each ( me.list.config.columns , function ( k , v ) {
			v.num = k ;
			addProps ( v ) ;
		} ) ;
	} ,

	loadListItems : function ( callback ) {
		var me = this ;
		var tmp = [] ;
		$.each ( me.list.items , function ( k , v ) { tmp.push(v) } ) ;
		
		
		// Sanitise property names, and pre-cache for loading
		me.addAuxItems ( tmp ) ;

		me.wd.getItemBatch ( tmp , function () {

			return ;
		}
		me.loading ( true ) ;
		$('#loading_message').html('list info') ;

			query:'get_list',
			list:list
		} , function ( d ) {
			me.list = d.data ;
			me.list.items = me.list.items.replace(/^,/,'').replace(/,$/,'') ;
			if ( me.list.items == '' ) me.list.items = [] ;
			else me.list.items = me.list.items.split(',') ;
			me.listItems2Q() ;
			me.updateTitle() ;
			me.loadListItems ( function () {

			} ) ;

	} ,
	
	loadSPARQL : function ( sparql , callback ) {
		var me = this ;
		me.loading ( true ) ;
		$('#loading_message').html('SPARQL data') ;
//		$.getJSON ( 'https://wdq.wmflabs.org/api?q='+encodeURIComponent(wdq)+'&callback=?' , function ( d ) {
		$.get ( 'https://query.wikidata.org/sparql' , {
			format:'json',

		} , function ( d ) {
			var items = [] ;
			var varname = d.head.vars[0] ;
			$.each ( d.results.bindings , function ( k , v ) {
				items.push ( v[varname].value.replace(/^.+\/Q/) ) ;
			} ) ;
			me.list.items = items ;
			me.listItems2Q() ;

	num : function ( i ) { // Returns raw number string for P/Q
		return (''+i).replace(/\D/g,'') ;
	} ,
	
	mainsnak2text : function ( mainsnak , precision_override ) {
		var me = this ;
		var v = mainsnak.datavalue.value ;
		if ( mainsnak.datatype == 'wikibase-item' ) {
			return 'Q'+v['numeric-id'] ;
		} else if ( mainsnak.datatype == 'quantity' ) {
			var t = '' + (v.amount*1) ;
			return t ;
		} else if ( mainsnak.datatype == 'time' ) {
			var t = v.time ;
			var m = v.time.match ( /^([\+\-])0*(\d+)-(\d\d)-(\d\d)/ ) ;
			if ( m != null ) {
				var prefix = m[1] ;
				var prec = v.precision ;
				if ( typeof precision_override != 'undefined' && precision_override != '' && precision_override != 0 ) prec = precision_override ;
				if ( prefix == '+' ) prefix = '' ;
				if ( prec <= 8 ) {
					var y = m[2] * 1 ;
					if ( prec == 8 ) y -= y%10 ;
					else if ( prec == 7 ) y -= y%100 ;
					else if ( prec <= 6 ) y -= y%1000 ;
					t = prefix+y+'s' ;
				} else if ( prec ==  9 ) t = prefix+m[2] ;
				else if ( prec == 10 ) t = prefix+m[2]+'-'+m[3] ;
				else if ( prec >= 11 ) t = prefix+m[2]+'-'+m[3]+'-'+m[4] ;
			}
			return t ;
		}
		return ;
	} ,
	
	claim2text : function ( claim , precision_override ) {
		var me = this ;
		if ( typeof claim == 'undefined' ) return ;
		if ( typeof claim.mainsnak == 'undefined' ) return ;

		return me.mainsnak2text ( claim.mainsnak , precision_override ) ;
	} ,
	

	getSectionKey : function ( i , meta ) {
		if ( typeof i == 'undefined' ) return ; // No item, no key
		var me = this ;
		var key ;

		var claims = i.getClaimsForProperty(meta.p) ;
		var fc = me.getColumnFilter ( meta , claims ) ;
		var rc = me.getOnlyRankedClaims ( fc ) ;
		if ( rc.length == 0 ) return key ; // No hope...

		if ( meta.type == 'property' ) {

			key = me.claim2text ( rc[0] , meta.precision ) ;

		} else if ( meta.type == 'prop_qual' ) {

			$.each ( rc , function ( dummy , claim ) {
				$.each ( ((claim.qualifiers||{})[meta.qual]||[]) , function ( k , v ) {
					key = me.claim2text ( claim , meta.precision ) + ': ' + me.mainsnak2text ( v , meta.precision ) ;
					return true ;
				} ) ;
				if ( typeof key != 'undefined' ) return true ;
			} ) ;

		} else if ( meta.type == 'prop_item_qual' ) {

			$.each ( rc , function ( dummy , claim ) {
//				if ( (claim.mainsnak||{}).datatype != 'wikibase-item' ) return ;
//				if ( claim.mainsnak.datavalue.value['numeric-id'] != meta.item.replace(/\D/g,'') ) return ;
				$.each ( ((claim.qualifiers||{})[meta.qual]||[]) , function ( k , v ) {
					key = me.mainsnak2text ( v , meta.precision ) ;
					return true ;
				} ) ;
				if ( typeof key != 'undefined' ) return true ;
			} ) ;

		}

		return key ;
	} ,
	
	items2sections : function () {
		var me = this ;
		if ( me.list.config.sections.length == 0 ) return ;
		
		function getSectionSize ( root , sec ) {
			if ( root.leaf ) return sec.qs.length ;
			var ret = 0 ;
			$.each ( (sec.sections||{}) , function(k,v) { ret += getSectionSize(sec,v) } ) ;
			return ret ;
		}
		
		function subSection ( num , items ) {
			var meta = me.list.config.sections[num] ;
			var misc_key = me.t('misc') ;
			if ( typeof meta.labels == 'object' ) {
				if ( typeof meta.labels[me.getLanguage()] != 'undefined' ) misc_key = meta.labels[me.getLanguage()] ;
			}
			var section = {
				tag : 'h'+(num+2) ,
				misc_key : misc_key ,
				sections : {} ,
				order : [] ,
				meta : meta ,
				leaf : num+1 == me.list.config.sections.length
			} ;
//			if ( meta.type == 'property' ) meta.p = 'P'+me.num(meta.p) ;
			
			var sec = {} ;
			$.each ( items , function ( dummy , q ) {
				var key = me.getSectionKey ( me.wd.getItem(q) , meta ) ;
				if ( typeof key == 'undefined' ) key = misc_key ;
				if ( typeof sec[key] == 'undefined' ) sec[key] = {qs:[]} ;
				sec[key].qs.push ( q ) ;
			} ) ;
			
			// Min filter
			if ( typeof meta.min != 'undefined' ) {
				var min = meta.min * 1 ;
				$.each ( sec , function ( k , v ) {
					if ( v.qs.length >= min ) return ; // Large enough
					if ( k == misc_key ) return ; // Is misc section
					if ( typeof sec[misc_key] == 'undefined' ) sec[misc_key] = {qs:[]} ;
					$.each ( v.qs , function ( k1 , v1 ) {
						sec[misc_key].qs.push ( v1 ) ;
					} ) ;
					delete sec[k] ;
				} ) ;
			}
			
			// Recurse into sub-sections
			if ( section.leaf ) {
				section.sections = sec ;
			} else {
				$.each ( sec , function ( k , v ) {
					section.sections[k] = subSection ( num+1 , v.qs ) ;
				} ) ;
			}

			// Order by descending section size
			$.each ( section.sections , function ( k , v ) {
				if ( k == misc_key ) return ;
				section.order.push ( k ) ;
				v.sectionSize = getSectionSize ( section , v ) ;
//				console.log ( k , v.sectionSize ) ;
			} ) ;
			section.order = section.order.sort ( function ( a , b ) {
//				console.log ( a , b , section.sections[b].sectionSize , section.sections[a].sectionSize ) ;
				return section.sections[b].sectionSize - section.sections[a].sectionSize ;
			} ) ;
			if ( typeof section.sections[misc_key] != 'undefined' ) section.order.push ( misc_key ) ;

			return section ;
		}
		
		me.sections = subSection ( 0 , me.list.items ) ;
	} ,
	
	getLanguage : function () {
		return this.language ; //me.list.config.language ;
	} ,
	
	
	updateItems : function ( callback ) {
		var me = this ;
		var tmp = [] ;
		$.each ( me.update_items , function ( k , v ) { tmp.push(k) } ) ;
		me.update_items = {} ;

		var running = 2 ;
		var tmp2 = [] ;
		$.each ( me.load_labels , function ( k , v ) {
			if ( typeof me.wd.items[k] != 'undefined' ) return ;
			tmp2.push(k) ;
		} ) ;
		me.load_labels = {} ;
		
		
		function fin () {
			running-- ;
			if ( running > 0 ) return ;
			var lang = me.getLanguage() ;
			$.each ( tmp2 , function ( k , v ) { tmp.push ( v ) } ) ;
			$.each ( tmp , function ( k , v ) {
				var text = v ;
				var i = me.wd.getItem(v) ;
				if ( typeof i == 'undefined' ) i = me.wdl.getItem(v) ;
				if ( typeof i != 'undefined' ) text = i.getLabel(lang) ;
				var key = 'span.'+sanitizeID(v) ;
				$(key).text ( text ) ;
				key = 'a.'+sanitizeID(v) ;
				$(key).each ( function () { me.updateItemLink(v,$(this)) } ) ;
//				replaceWith ( me.getItemLink(v,{blank_fallback:true}) ) ; // TODO column
			} ) ;
			$('a.cleanup').remove() ;
			$('td > div:empty').remove() ;
			me.loading ( false ) ;
			if ( typeof callback != 'undefined' ) callback() ;
		}
		
		me.loading ( true ) ;
		var num = prettyNumber ( tmp.length + tmp2.length ) ;
		$('#loading_message').html ( num + " labels from Wikidata" ) ;
		me.wd.getItemBatch ( tmp , function () { fin() } ) ;
		me.wdl.getItemBatch ( tmp2 , function () { fin() } ) ;
	} ,
	
	updateItemLink : function ( q , o ) {
		var me = this ;
		var col = o.attr('col') ;
		col = $.extend ( {blank_fallback:true} , me.list.config.columns[col] ) ;
		var h = me.getItemLink ( q , col ) ;
		o.replaceWith(h).removeClass('cleanup') ;
	} ,
	
	getItemLink : function ( q , c ) {
		var me = this ;
		var lang = me.getLanguage() ;
		var url = "//www.wikidata.org/wiki/" + q ;
		var text = q ;
		var classname = 'wikidata' ;
		if ( c.type == 'item' ) {
			// Default
		} else {
			var i = me.wd.getItem(q) ;
			if ( typeof i != 'undefined' ) {
				var sl = i.getWikiLinks() ;
				if ( typeof sl[lang+'wiki'] != 'undefined' ) {
					url = '//' + lang + '.wikipedia.org/wiki/' + encodeURIComponent(sl[lang+'wiki'].title.replace(/ /g,'_')) ;
					text = sl[lang+'wiki'].title.replace(/_/g,' ') ;
					classname = 'wiki' ;
				}
			} else if ( typeof me.wdl.getItem(q) != 'undefined' ) {
				i = me.wdl.getItem(q) ;
				var sl = i.getWikiLinks() ;
				if ( typeof sl[lang+'wiki'] != 'undefined' ) {
					url = '//' + lang + '.wikipedia.org/wiki/' + encodeURIComponent(sl[lang+'wiki'].title.replace(/ /g,'_')) ;
					text = sl[lang+'wiki'].title.replace(/_/g,' ') ;
					classname = 'wiki' ;
				}
			} else {
				if ( c.blank_fallback ) return '' ;
				me.load_labels[q] = 1 ;
				return "<a href='' target='_blank' col='" + c.num + "' class='cleanup " + sanitizeID(q) + "'>...</a>" ;
			}
			text = me.getAutoLabel ( q ) ;
		}
		var h = "<a href='" + url + "' class='" + classname + "' target='_blank'>" + text + "</a>" ;
		return h ;
	} ,

	renderMainSnak : function ( col , mainsnak ) {
		var me = this ;
		var h = '' ;
		var dt = mainsnak.datatype ;
		var v = mainsnak.datavalue.value ;
		if ( dt == 'globe-coordinate' ) {
			var lat = v.latitude > 0 ? v.latitude+'_N_' : (-v.latitude)+'_S_' ;
			var lon = v.longitude > 0 ? v.longitude+'_E_' : (-v.longitude)+'_W_' ;
			var url = 'https://tools.wmflabs.org/geohack/geohack.php?language='+me.getLanguage()+'&params='+lat+lon+'globe:earth' ;
			h += "<a href='" + url + "' class='external' target='_blank'>" + v.latitude + '/' + v.longitude + "</a>" ;
		} else if ( dt == 'string' ) {
			if ( col.type == 'property' ) {
				var i = me.wd.getItem(col.p) ;
				if ( typeof i != 'undefined' && i.hasClaims('P1630') ) {
					var pc = i.getClaimsForProperty('P1630') ;
					var url = pc[0].mainsnak.datavalue.value ;
					url = url.replace ( '$1' , v ) ;
					h += "<a href='"+url+"' class='external' target='_blank'>"+v+"</a>" ;
				} else {
					h += v ;
				}
			} else {
				h += v ;
			}
		} else if ( dt == 'wikibase-item' ) {
			h += me.getItemLink ( 'Q'+v['numeric-id'] , col ) ;
		} else if ( dt == 'time' ) {
			h += me.mainsnak2text ( mainsnak ) ;
		} else if ( dt == 'quantity' ) {
			h += me.mainsnak2text ( mainsnak ) ;
		} else {
			console.log ( dt ) ;
			h += "<i>CLAIMS</i>" ;
		}
		return h ;
	} ,

	renderRankedClaimList : function ( col , claims ) {
		if ( claims.length == 0 ) return '' ;
		var me = this ;
		var p = col.p ;
		var h = '' ;

		if ( col.type == 'property' ) {
			var dt = claims[0].mainsnak.datatype ;
			if (dt == 'commonsMedia' ) {
				var image = claims[0].mainsnak.datavalue.value ;
				var id = 'thumb_' + me.thumbs2load.length ;
				if ( typeof me.thumb_cache[image] == 'undefined' ) {
					h = "<img class='pre_thumb' src='' id='" + id + "' />" ; // style='display:none' 
					me.thumbs2load.push ( { image:image , id:id } ) ;
				} else {
					h = "<img class='thumb' src='" + me.thumb_cache[image] + "' />" ;
				}
				return h ;
			}
		}
		
		$.each ( claims , function ( k , claim ) {
		
			
			if ( col.type == 'prop_qual' ) {
				$.each ( claim.qualifiers[col.qual] , function ( k , v ) {
					h += "<div>" ;
					h += me.renderMainSnak ( col , claim.mainsnak ) ;
					h += ": " ;

	getRankedClaims : function ( claims ) {

	getColumnFilter : function ( col , claims ) {

	t : function () {
		var me = this ;
		var key = arguments[0] ;
		if ( typeof me.i18n[key] == 'undefined' ) return "<i>UNDEFINED I18N KEY "+key+"</i>" ;
		var lang = me.getLanguage() ;
		if ( typeof me.i18n[key][lang] == 'undefined' ) lang = 'en' ; // FALLBACK
		if ( typeof me.i18n[key][lang] == 'undefined' ) return "<i>NO SUITABLE VALUE FOR I18N KEY "+key+"</i>" ;
		var ret = me.i18n[key][lang] ;
		$.each ( arguments , function ( k , v ) {
			if ( k == 0 ) return ;
			ret = ret.replace ( '$'+k , v ) ;
		} ) ;
		return ret ;
	} ,

	showListOptions : function ( callback ) {
		
		function renderColumnSettings ( num , c ) {
		
			var colsec = c.is_section ? 'section' : 'column' ;

			function render_ig ( num , classname , p , pq ) {
				var input_type = 'number' ;
				var width = 80 ;
				var placeholder = pq ;
				var value = (''+p).replace(/\D/g,'') ;

				if ( pq == 'Q' ) width = 120 ;
				if ( pq == 'P' || pq == 'Q' ) placeholder += ' number' ;

				if ( pq.toLowerCase() == 'wiki' ) {
					width = 160 ;
					input_type = 'text' ;
					value = (p||'') ;
				}
				
				if ( classname == 'section_precision' ) {
					width = 150 ;
				}

				var h = '' ;
				h += '<div class="input-group" style="margin-right:5px;">' ;
				h += '<span class="input-group-addon">'+pq+'</span>' ;
				h += '<input type="'+input_type+'" type2="'+colsec+'" class="form-control '+classname+'" placeholder="'+placeholder+'" value="' + value + '" style="text-align:right;width:'+width+'px;" />' ;
				h += '</div>' ;
				return h ;
			}

			var h = '' ;
			h += "<tr col='"+num+"' style='margin-bottom:5px;'>" ;
			h += "<td nowrap style='text-align:right;font-family:Courier'>" + (num+1) + "</td>" ;
			
			
//			h += "<div style='display:inline-block'>" ;
			h += "<td nowrap>" ;
			h += '<select class="form-control column_type" type="'+colsec+'">' ;
			$.each ( c.is_section ? me.section_types : me.column_types , function ( k , v ) {
				var name = ucFirst ( v ) ;
				if ( typeof me.i18n['name_'+v] != 'undefined' ) name = me.t('name_'+v) ;
				h += "<option value='" + v + "'" ;
				if ( v == c.type ) h += " selected" ;
				h += ">" + name ;
				h += "</option>" ;
			} ) ;
			h += '</select> ' ;
			h += "</td>" ;


			h += "<td nowrap>" ;
			if ( c.type == 'property' ) {
				h += render_ig ( num , 'col_prop' , c.p , 'P' ) ;
			} else if ( c.type == 'prop_qual' ) {
				h += render_ig ( num , 'col_prop' , c.p , 'P' ) ;
				h += render_ig ( num , 'col_qual' , c.qual , 'P' ) ;
			} else if ( c.type == 'prop_item_qual' ) {
				h += render_ig ( num , 'col_prop' , c.p , 'P' ) ;
				h += render_ig ( num , 'col_item' , c.item , 'Q' ) ;
				h += render_ig ( num , 'col_qual' , c.qual , 'P' ) ;
			} else if ( c.type == 'sitelink' ) {
				h += render_ig ( num , 'col_wiki' , c.wiki , 'Wiki' ) ;
			}

			if ( c.is_section ) {
				h += render_ig ( num , 'section_threshold' , c.min , me.t('section_threshold') ) ;
				var pi ;
				if ( c.type == 'property' ) pi = me.wd.getItem(c.p) ;
				if ( typeof pi != 'undefined' && pi.raw.datatype == 'time' ) {
					h += render_ig ( num , 'section_precision' , (c.precision||'') , me.t('precision') ) ;
				}
			}
			
			h += "</td>" ;
			
			var base = c.is_section ? me.list.config.sections : me.list.config.columns ;

			h += "<td style='min-width:200px;' nowrap>" ;
			h += '<div class="btn-group" role="group">' ;
			if ( base.length > 1 || c.is_section ) h += "<button class='btn btn-danger remove_column' type='"+colsec+"'><span class='glyphicon glyphicon-remove' aria-hidden='true'></span></button>" ;
			h += "<button class='btn btn-success add_column' type='"+colsec+"'><span class='glyphicon glyphicon-plus' aria-hidden='true'></span></button>" ;
			if ( c.num > 0 ) h += "<button class='btn btn-default column_up' type='"+colsec+"'><span class='glyphicon glyphicon-triangle-top' aria-hidden='true'></span></button>" ;
			if ( c.num+1 < base.length ) h += "<button class='btn btn-default column_down' type='"+colsec+"'><span class='glyphicon glyphicon-triangle-bottom' aria-hidden='true'></span></button>" ;
			h += "</div>" ;
			h += "</td>" ;
			

			// Static translations/default section names
			h += "<td style='width:100%'>" ;
			$.each ( (c.labels||[]) , function ( k , v ) {
				h += "<div class='column_label'>" ;
				h += '<div class="input-group">' ;

	loadThumb : function ( img ) {
		var me = this ;
//		if ( img.css('display') === 'none' ) return ; // Hacking around Chrome bug; should be: 
		if ( !me.isChrome && !img.is(':visible') ) return ;
//		if ( img.is(':hidden') ) return ;

		if ( !img.is_on_screen() ) return ;
		
		img.addClass('thumb').removeClass('pre_thumb') ;
		
		var filename ;
		$.each ( me.thumbs2load , function ( k , v ) {
			if ( v.id != img.attr('id') ) return ;
			filename = v.image ;
			return false ;
		} ) ;
		if ( typeof filename == 'undefined' ) { // Paranoia
			console.log ( "FAILED to load " + img.attr('id') ) ;
			return ;
		}
		
		$.getJSON ( 'https://commons.wikimedia.org/w/api.php?callback=?' , {
			action:'query',
			titles:'File:'+filename,
			prop:'imageinfo',
			iiprop:'url|size',
			iiurlwidth:(me.list.config.thumbsize||120),
			iiurlheight:(me.list.config.thumbsize||120),
			format:'json'
		} , function ( d ) {
			$.each ( d.query.pages , function ( k1 , v1 ) {
				var url = v1.imageinfo[0].thumburl ;
				me.thumb_cache[filename] = url ;
				img.attr ( { src:url } ) .show() ;
			} ) ;
		} ) ;
	} ,

	renderList : function ( callback ) {
		var me = this ;
		me.updateChromeTranslations() ;
		$('#main').html ( '' ) ;
		$('#table_info_row').show() ;
		me.items2sections () ;
		me.update_items = {} ;
		me.load_labels = {} ;
		me.thumbs2load = [] ;

		if ( me.list.items.length == 0 ) {
			me.updateListInfo() ;
			var h = "This list is empty, maybe <a href='./api.php?query=update_list&list=" + me.list.id + "' target='_blank'>update it</a>." ;
			$('#main').html ( h ) ;
			return ;
		}

		if ( (me.list.config.sections||[]).length == 0 ) me.renderSingleSection() ;
		else if ( me.list.config.table == 'joined' ) me.renderJoinedSections() ;
		else if ( me.list.config.table == 'sectioned' ) me.renderSection ( me.sections ) ;
		else me.renderTabbedSections() ; // tabbed
		
		$('table.tablesorter').tablesorter() ;
		$('table.tablesorter').bind("sortEnd",function(e, table) { me.pingThumbnails() } ) ;
		
		me.updateListInfo() ;
//		$('#list_tab_header a[href="#lo_view"]').tab('show') ;
		
		if ( !me.isChrome ) me.pingThumbnails() ;
		
		me.updateItems ( function () {
			if ( me.isChrome ) me.pingThumbnails() ;
			if ( typeof callback == 'undefined' ) callback = function () {} ;
			callback() ;
		} ) ;
	} ,

		h += '<div class="panel-heading">'+header+'</div>' ;
		h += "<div class=''>" ;
		h += '<table class="table">' ;
		h += "<thead><tr><th>"+me.t('list_name')+"</th><th>"+me.t('list_owner')+"</th><th style='text-align:right'>"+me.t('items_in_list')+"</th><th style='text-align:right'>"+me.t('list_created')+"</th></tr></thead><tbody>" ;
		$.each ( data , function ( k , v ) {
			h += "<tr>" ;
			h += "<td><a class='load_list' list='" + v.id + "' href='#'>" + v.name + "</a></td>" ;
			h += "<td nowrap><a target='_blank' class='wikidata' href='//www.wikidata.org/wiki/User:" + escattr(encodeURIComponent(v.owner)) + "'>" + v.owner + "</a></td>" ;
			h += "<td nowrap class='numeric'>" + prettyNumber(v.number_of_items) + "</td>" ;
			h += "<td nowrap class='numeric'>" + v.created.replace(/[^0-9:\-]/g,' ') + "</td>" ;
			h += "</tr>" ;
		} ) ;
		h += "</tbody></table>" ;
		h += "</div>" ;
		h += '</div>' ;
		h += '</div>' ;
		$('#main').append ( h ) ;
		$('#'+id+' a.load_list').click ( function () {
			var o = $(this) ;
			var list_id = o.attr('list') ;
			me.run ( { list:list_id } ) ;
			return false ;
		} ) ;
	} ,
	
	showLists : function () {
		var me = this ;
		var lists = {} ;
		
		me.list_options_is_expanded = false ;

		$('#main').html ( '' ) ;
		$('#table_info_row').hide() ;
		me.loading(true) ;
		
		var running = 1 ;
		function fin () {
			running-- ;
			if ( running > 0 ) return ;
			me.loading(false) ;
			me.showListOfLists ( me.t('last_lists_created') , lists.last ) ;
			if ( typeof lists.user != 'undefined' && lists.user.length > 0 ) me.showListOfLists ( me.t('your_lists') , lists.user ) ;
		}

		if ( typeof me.username != 'undefined' ) {
			running++ ;
			$.get('./api.php',{
				query:'get_user_lists',
				user:me.username ,
				limit : 20
			} , function ( d ) {
				lists.user = d.data ;
				fin() ;
			} , 'json' ) ;
		}
		
		$.get('./api.php',{
			query:'get_last_lists' ,
			limit : 20
		} , function ( d ) {
			lists.last = d.data ;
			fin() ;
		} , 'json' ) ;

		
	} ,
	
	run : function ( o ) {
		var me = this ;
		$('#main').html ( '' ) ;
		$('#title').html ( '' ) ;
		if ( typeof o != 'undefined' ) {
			me.params = o ;
		}

		var hash = [] ;
		$.each ( me.params , function ( k , v ) {
			if ( k == '' || typeof v == 'undefined' ) return ;
			hash.push ( k + '=' + encodeURIComponent(v) ) ;
		} ) ;
		window.location.hash = hash.join('&') ;
		
/*		if ( me.params.list == 'new' ) {
			delete me.params.list ;
			me.createNewList() ;
		} else*/
		if ( typeof me.params.list != 'undefined' ) { //&& me.params.list != (me.list||{}).id ) {
			me.loadAndRenderList ( me.params.list ) ;
		} else {
			me.showLists() ;
		}
	} ,

	search : function () {
		var me = this ;
		var text = $('#search_form input').val() ;
		$('#main').html ( '' ) ;
		$.get ( './api.php' , {
			query:'search',
			text:text
		} , function ( d ) {
			if ( d.data.length == 0 ) {
				$('#main').html ( me.t('no_search_results') ) ;
			} else {
				me.showListOfLists ( me.t('search_results') , d.data ) ;
			}
		} , 'json' ) ;
	} ,
	
	
	hashHasChanged : function () {
/*		var me = this ;
		me.getParams() ;
		if ( typeof me.params.lang != 'undefined' ) me.language = me.params.lang ;
		me.run() ;*/
	} ,
	
	fin : 1
} ;

</script>

</head>
